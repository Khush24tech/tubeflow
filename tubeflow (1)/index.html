    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",

          "name": "Tubeflow",

          "url": "https://tubeflow.app",

            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://tubeflow.app/?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
